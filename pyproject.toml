[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-admin-mask"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django==5.2.17",
]

[tool.hatch.build.targets.wheel]
packages = ["admin_mask"]
include = [
    "admin_mask/static/**",
    "admin_mask/templates/**",
]

[tool.hatch.build.targets.sdist]
include = [
    "/admin_mask",
]
exclude = [
    "*.pyc",
    "__pycache__",
    ".git*",
]

